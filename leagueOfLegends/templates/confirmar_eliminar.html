{% extends 'menu.html' %}

{% block content %}
<section class="seccion-meta">
    <div class="container-meta">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark text-white border-danger rounded-4 shadow-lg">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-exclamation-triangle text-danger mb-4" style="font-size: 3rem;"></i>
                        <h2 class="h4 mb-4">Confirmar Eliminación</h2>
                        <p class="text-secondary-emphasis mb-5">
                            ¿Estás seguro de que deseas eliminar al campeón <strong>{{ personaje.nombre }}</strong>? 
                            Esta acción no se puede deshacer.
                        </p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-3 justify-content-center">
                                <a href="{% url 'gestion_campeones' %}" class="btn btn-outline-secondary px-4">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-danger px-4">
                                    Eliminar Definitivamente
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
